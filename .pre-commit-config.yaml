default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      # go.mod `ignore` keeps submodules/ and node_modules/ out of ./...
      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./... && go vet -tags integration ./tests/...'
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'if command -v golangci-lint >/dev/null 2>&1; then golangci-lint run ./...; elif [ -x "$HOME/go/bin/golangci-lint" ]; then "$HOME/go/bin/golangci-lint" run ./...; else echo "golangci-lint not installed; skipped (CI requires it)"; fi'
        language: system
        pass_filenames: false

      - id: go-test
        name: go test (cmd, internal)
        entry: bash -c 'mkdir -p .cache/go-build && GOCACHE=$PWD/.cache/go-build go test ./cmd/... ./internal/...'
        language: system
        pass_filenames: false

      - id: comment-policy
        name: comment policy (CLAUDE.md, Code Comments and Legacy)
        entry: ./scripts/check-comment-policy.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: check-doc-links
        name: check doc links
        entry: ./scripts/check-doc-links.sh
        language: system
        pass_filenames: false
        files: \.(md)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  # Conventional Commits on the commit message (same types as
  # commitlint.config.mjs and the Commits workflow).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, ci, perf, build]
