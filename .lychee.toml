verbose = "info"
no_progress = true
max_redirects = 5
timeout = 20
max_retries = 2
retry_wait_time = 2
accept = [200, 204, 206, 301, 302, 307, 308, 403, 429]

exclude = [
  "^http://localhost(:\\d+)?",
  "^http://127\\.0\\.0\\.1(:\\d+)?",
  "^http://0\\.0\\.0\\.0(:\\d+)?",
  # pkg.go.dev lists a module only after the Go module proxy has served a
  # version of it. The module path github.com/SevenOfNine-labs/proton-lfs-cli
  # takes effect with the commit that introduces it; remove this entry once
  # https://pkg.go.dev/github.com/SevenOfNine-labs/proton-lfs-cli returns 200
  # (tracked in docs/project/current-state.md).
  "^https://pkg\\.go\\.dev/github\\.com/SevenOfNine-labs/proton-lfs-cli$",
]
