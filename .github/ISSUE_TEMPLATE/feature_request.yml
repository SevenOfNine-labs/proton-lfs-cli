name: Feature request
description: A change to the adapter, the tray, packaging or the docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do with Git LFS and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you suggest, and the Git LFS or Proton documentation it follows.
