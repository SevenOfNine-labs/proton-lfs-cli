name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.8.0
          install-only: true

      # Same commands as locally: gofmt over every Go tree, go vet over ./...
      # (go.mod `ignore` keeps submodules/ and node_modules/ out) plus the
      # integration-tagged tests, golangci-lint with .golangci.yml
      # (build-tags: integration). CI=true makes a missing golangci-lint fatal.
      - name: gofmt, go vet, golangci-lint
        env:
          CI: "true"
        run: make fmt-check lint
