name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-quality:
    name: Markdown lint and link checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No submodules: the lint globs and scripts/check-doc-links.sh cover
      # only this repository's Markdown.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint.json
          globs: |
            README.md
            USAGE.md
            SECURITY.md
            CONTRIBUTING.md
            docs/**/*.md

      - name: Check internal markdown links
        run: ./scripts/check-doc-links.sh

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --config .lychee.toml
            README.md
            USAGE.md
            SECURITY.md
            CONTRIBUTING.md
            docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Build and deploy unified docs to GitHub Pages
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install honkit
        run: npm install -g honkit@6.2.5

      - name: Build markdown docs with honkit
        run: honkit build

      # Landing page is tracked at docs/site/index.html; honkit output goes
      # to guides/ (links in the landing page follow SUMMARY.md).
      - name: Create unified documentation structure
        run: |
          mkdir -p docs-build/unified
          cp -r _book docs-build/unified/guides
          cp docs/site/index.html docs-build/unified/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-build/unified

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
