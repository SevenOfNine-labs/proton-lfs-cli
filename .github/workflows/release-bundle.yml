name: Release Bundle

# The single release pipeline. On a v* tag it:
#   1. builds the standalone adapter binaries (build.yml, workflow_call),
#   2. builds adapter + tray + proton-drive-cli SEA per platform,
#   3. packages the platform bundles (.app zip, .tar.gz, .zip),
#   4. publishes one GitHub Release with every asset and one SHA256SUMS.txt.
# workflow_dispatch runs steps 1-3 only (artifacts, no release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapters:
    name: Standalone adapters
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build-all:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            target: darwin-arm64
          # darwin-amd64 omitted: free Intel macOS runners retired by GitHub
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: windows-amd64

    env:
      # One version source for every binary built in this job.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only proton-drive-cli (and its vendored SDK) is built here; git-lfs and
      # pass-cli are not part of the bundle.
      - name: Init proton-drive-cli submodule
        shell: bash
        run: |
          git submodule update --init submodules/proton-drive-cli
          git -C submodules/proton-drive-cli submodule update --init submodules/sdk

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack + Yarn 4
        shell: bash
        run: |
          # Remove pre-installed yarn 1.x on Windows so corepack shim takes priority
          npm uninstall -g yarn 2>/dev/null || true
          corepack enable
          corepack prepare yarn@4.1.1 --activate
          yarn --version

      # ── Go adapter and tray (scripts/build-go.sh: cgo only for the macOS tray)
      - name: Build adapter
        shell: bash
        env:
          STRIP: "1"
        run: bash scripts/build-go.sh adapter "build/git-lfs-proton-adapter${{ matrix.goos == 'windows' && '.exe' || '' }}"

      - name: Build tray app
        shell: bash
        env:
          STRIP: "1"
        run: bash scripts/build-go.sh tray "build/proton-lfs-tray${{ matrix.goos == 'windows' && '.exe' || '' }}"

      # ── proton-drive-cli SEA ─────────────────────────────────
      - name: Install JS dependencies
        shell: bash
        run: yarn install --immutable

      - name: Build vendored SDK
        shell: bash
        run: |
          cd submodules/proton-drive-cli/submodules/sdk/client/js
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Build proton-drive-cli runtime
        shell: bash
        working-directory: submodules/proton-drive-cli
        run: yarn build

      - name: Build proton-drive-cli SEA
        shell: bash
        env:
          # Relative to the checkout: a POSIX path on every runner.
          SEA_OUTPUT_DIR: build
        run: bash scripts/build-sea.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: build/
          retention-days: 7

  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: build-all
    strategy:
      fail-fast: false
      matrix:
        include:
          # The .app is ad-hoc signed and zipped with ditto, so it needs macOS.
          - target: darwin-arm64
            goos: darwin
            os: macos-14
          - target: linux-amd64
            goos: linux
            os: ubuntu-latest
          - target: windows-amd64
            goos: windows
            os: ubuntu-latest

    steps:
      - name: Checkout (for packaging scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.target }}
          path: build/

      - name: Package bundle
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/package-bundle.sh "${{ matrix.target }}" "${{ matrix.goos }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - adapters
      - package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download platform bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist/
          merge-multiple: true

      - name: Download standalone adapters
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: git-lfs-proton-adapter-*
          path: dist/
          merge-multiple: true

      # One checksum file covering every published asset (bundles and the
      # standalone adapters that scripts/install-adapter.sh verifies).
      - name: Generate checksums
        run: |
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          # sha512 published next to the release asset:
          # https://github.com/orhun/git-cliff/releases/tag/v2.14.2
          GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
        run: |
          set -euo pipefail
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive"
          sudo mv "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/
          git-cliff --version

      - name: Generate changelog
        env:
          # Lets git-cliff resolve PR numbers and authors (cliff.toml remote fields).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --config cliff.toml --github-repo "${{ github.repository }}" \
            --latest --strip header --output CHANGELOG.md
          cat CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: CHANGELOG.md
          files: |
            dist/*
