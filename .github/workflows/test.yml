name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bridge contract tests in cmd/adapter read the JSON schemas shipped
      # in submodules/proton-drive-cli/schemas/bridge/v1.
      - name: Init proton-drive-cli submodule (schemas only, non-recursive)
        run: git submodule update --init --depth=1 submodules/proton-drive-cli

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests with coverage (cmd/..., internal/...)
        run: |
          go test -race -coverprofile=coverage.out ./cmd/... ./internal/...
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-test-tray:
    name: Tray tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # fyne.io/systray needs cgo only on darwin. Linux proves the pure-Go
      # build (CGO_ENABLED=0, so no -race, which the Go tests job covers);
      # macOS exercises the Cocoa/cgo path.
      - name: Run tray tests
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            CGO_ENABLED=0 go test -cover ./cmd/tray/...
          else
            go test -race -cover ./cmd/tray/...
          fi

  integration-local:
    name: Integration local backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install git-lfs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Install git-lfs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git-lfs

      - name: Verify git-lfs
        shell: bash
        run: |
          git lfs version

      - name: Run local backend integration tests
        shell: bash
        run: |
          go test -tags integration ./tests/integration/... \
            -run '^TestGitLFSCustomTransfer(StandaloneUpload|DownloadRoundTrip|ConcurrentRoundTrip)$' -v

  integration-adapter-exit:
    name: Integration adapter exit mid-transfer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install git-lfs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Install git-lfs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git-lfs

      - name: Install git-lfs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install git-lfs -y

      - name: Verify git-lfs
        shell: bash
        run: |
          git lfs version

      - name: Run adapter-exit integration tests
        shell: bash
        run: |
          go test -tags integration ./tests/integration/... -run '^TestGitLFSCustomTransferAdapterExitsMid' -v

  integration-stress:
    name: Integration concurrency stress (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTON_LFS_STRESS_FILE_COUNT: "16"
      PROTON_LFS_STRESS_ROUNDS: "2"
      PROTON_LFS_STRESS_CONCURRENCY: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Verify git-lfs
        shell: bash
        run: |
          git lfs version

      - name: Run concurrency stress/soak integration test
        shell: bash
        run: |
          go test -tags integration ./tests/integration/... -run '^TestGitLFSCustomTransferConcurrentStressSoak$' -v

  integration-failure-modes:
    name: Integration failure modes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs version

      - name: Run failure mode integration tests
        run: |
          go test -tags integration ./tests/integration/... \
            -run '^TestGitLFSCustomTransfer(RejectsWrongOID|FailsWhenAdapter)' -v

  integration-config-matrix:
    name: Integration config matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs version

      - name: Run direction config matrix tests
        run: |
          go test -tags integration ./tests/integration/... \
            -run '^TestGitLFSCustomTransferDirection' -v

  integration-credentials:
    name: Integration credential security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js (runs the recording bridge stand-in)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Build adapter
        run: make build

      - name: Run credential security tests (mocked pass-cli, recording bridge)
        env:
          PROTON_PASS_CLI_BIN: ${{ github.workspace }}/scripts/mock-pass-cli.sh
        run: |
          chmod +x scripts/mock-pass-cli.sh
          go test -tags integration ./tests/integration/... -run '^TestCredential' -v

  bridge-integration:
    name: Bridge integration (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs version

      - name: Run bridge integration test with mocked pass-cli and drive-cli
        env:
          # The SDK round-trip is opt-in so that `make test-integration` stays
          # offline; this job supplies the mocks and opts in.
          PROTON_LFS_RUN_SDK_INTEGRATION: "1"
          PROTON_PASS_CLI_BIN: ${{ github.workspace }}/scripts/mock-pass-cli.sh
          PROTON_DRIVE_CLI_BIN: ${{ github.workspace }}/tests/testdata/mock-proton-drive-cli.js
        run: |
          chmod +x scripts/mock-pass-cli.sh
          go test -tags integration ./tests/integration/... -run SDK -v

  drive-cli-tests:
    name: Drive CLI tests (Jest, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor of dist/index.js, 26 the LTS line in
        # .node-version used by every other job and the SEA build.
        node-version: ["22", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only proton-drive-cli and its vendored SDK are needed here.
      - name: Init proton-drive-cli submodule (non-recursive)
        run: |
          git submodule update --init --depth=1 submodules/proton-drive-cli
          git -C submodules/proton-drive-cli submodule update --init --depth=1 submodules/sdk

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.1.1 --activate

      - name: Build vendored SDK
        working-directory: submodules/proton-drive-cli/submodules/sdk/client/js
        run: npm install --no-package-lock --no-audit --no-fund && npm run build

      # proton-drive-cli owns its dependencies (package.json and yarn.lock in
      # the submodule); the release bundle installs from the same lockfile.
      - name: Install dependencies
        working-directory: submodules/proton-drive-cli
        run: yarn install --immutable

      - name: Build
        working-directory: submodules/proton-drive-cli
        run: yarn build

      - name: Run proton-drive-cli tests
        working-directory: submodules/proton-drive-cli
        run: yarn test

  e2e-mocked:
    name: Mocked E2E pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs version

      - name: Build adapter
        run: make build

      - name: Run mocked E2E pipeline tests
        env:
          PROTON_PASS_CLI_BIN: ${{ github.workspace }}/scripts/mock-pass-cli.sh
          PROTON_DRIVE_CLI_BIN: ${{ github.workspace }}/tests/testdata/mock-proton-drive-cli.js
        run: |
          chmod +x scripts/mock-pass-cli.sh
          go test -tags integration ./tests/integration/... -run E2EMocked -v
