name: Build Artifacts

# Cross-compiles the standalone adapter for every supported target and uploads
# the binaries as workflow artifacts. Releases are created only by
# release-bundle.yml, which calls this workflow (workflow_call) and attaches
# these artifacts next to the platform bundles.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp (the release tag); git describe when empty
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-adapter:
    name: Build adapter (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-amd64
            binary_name: git-lfs-proton-adapter-linux-amd64
          - goos: linux
            goarch: arm64
            target: linux-arm64
            binary_name: git-lfs-proton-adapter-linux-arm64
          - goos: darwin
            goarch: amd64
            target: darwin-amd64
            binary_name: git-lfs-proton-adapter-darwin-amd64
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
            binary_name: git-lfs-proton-adapter-darwin-arm64
          - goos: windows
            goarch: amd64
            target: windows-amd64
            binary_name: git-lfs-proton-adapter-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history for `git describe` and the commit-date BuildTime.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build adapter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
          STRIP: "1"
        run: bash scripts/build-go.sh adapter "bin/${{ matrix.binary_name }}"

      - name: Upload adapter artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary_name }}
          path: bin/${{ matrix.binary_name }}
          retention-days: 14
